name: Build ProxMenux Monitor AppImage

on:

  workflow_dispatch:  
  
permissions:
  contents: write
  
jobs:
  build:
    # Native builds only: every AppImage payload (runtime, wheels, tools)
    # must come from a runner of the target CPU.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        
    - name: Install dependencies
      working-directory: AppImage
      run: npm install --legacy-peer-deps
      
    - name: Build Next.js app
      working-directory: AppImage
      run: npm run build
      
    - name: Install Python dependencies
      run: |
        # Third-party apt repos on the runner (Google Chrome, Microsoft)
        # sometimes serve a hash-mismatched index and abort the refresh.
        # They are irrelevant here, so a failed refresh must not stop the
        # build: python3 comes from the Ubuntu repos, which fetch fine.
        sudo apt-get update || true
        sudo apt-get install -y python3 python3-pip python3-venv
        
    - name: Make build script executable
      working-directory: AppImage
      run: chmod +x scripts/build_appimage.sh
      
    - name: Build AppImage
      working-directory: AppImage
      run: ./scripts/build_appimage.sh

    - name: Set up Python 3.11 validation runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Verify bundled Python 3.11 runtime
      env:
        PYTHONPATH: /tmp/proxmenux_build/ProxMenux.AppDir/usr/lib/python3/vendor/cp311:/tmp/proxmenux_build/ProxMenux.AppDir/usr/lib/python3/dist-packages
      run: python -c 'import gevent, greenlet, geventwebsocket, zope.interface; from gevent import pywsgi; print(gevent.__version__)'

    - name: Set up Python 3.13 validation runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Verify bundled Python 3.13 runtime
      env:
        PYTHONPATH: /tmp/proxmenux_build/ProxMenux.AppDir/usr/lib/python3/vendor/cp313:/tmp/proxmenux_build/ProxMenux.AppDir/usr/lib/python3/dist-packages
      run: python -c 'import gevent, greenlet, geventwebsocket, zope.interface; from gevent import pywsgi; print(gevent.__version__)'
      
    - name: Get version from package.json
      id: version
      working-directory: AppImage
      run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
    - name: Generate SHA256 checksum
      run: |
        source AppImage/scripts/appimage_arch.sh
        pmx_appimage_arch "$(uname -m)"
        test "$PMX_APPIMAGE_ARCH" = '${{ matrix.arch }}'
        cd AppImage/dist
        sha256sum *.AppImage > "ProxMenux-Monitor${PMX_APPIMAGE_SUFFIX}.AppImage.sha256"
        echo "Generated SHA256:"
        cat ./*.sha256

    - name: Upload AppImage artifact
      uses: actions/upload-artifact@v7
      with:
        name: ProxMenux-${{ steps.version.outputs.VERSION }}-AppImage-${{ matrix.arch }}
        path: |
          AppImage/dist/*.AppImage
          AppImage/dist/*.sha256
        retention-days: 30

  # A single commit for every architecture: parallel matrix jobs pushing
  # to the same branch would race each other.
  publish:
    needs: build
    # A failed architecture must not hold back the others.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout main
      uses: actions/checkout@v6
      with:
        ref: main

    - name: Download AppImage artifacts
      uses: actions/download-artifact@v7
      with:
        pattern: ProxMenux-*-AppImage-*
        path: AppImage/dist
        merge-multiple: true

    - name: Upload AppImage and checksum to /AppImage folder in main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # Replace only the architectures rebuilt in this run.
        for sha in AppImage/dist/*.sha256; do
          [ -e "$sha" ] || continue
          name=$(basename "$sha")
          suffix=${name#ProxMenux-Monitor}
          suffix=${suffix%.AppImage.sha256}
          if [ -n "$suffix" ]; then
            rm -f AppImage/ProxMenux-*"$suffix".AppImage
          else
            find AppImage -maxdepth 1 -name 'ProxMenux-*.AppImage' ! -name 'ProxMenux-*-aarch64.AppImage' -delete
          fi
          rm -f "AppImage/$name"
        done

        # Copy new files
        cp AppImage/dist/*.AppImage AppImage/
        cp AppImage/dist/*.sha256 AppImage/

        git add AppImage/*.AppImage AppImage/*.sha256
        git commit -m "Update AppImage build ($(date +'%Y-%m-%d %H:%M:%S'))" || echo "No changes to commit"
        git push origin main
