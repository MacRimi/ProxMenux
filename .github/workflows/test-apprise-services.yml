name: Apprise Slack and Matrix

on:
  pull_request:
    paths:
      - '.github/workflows/test-apprise-services.yml'
      - 'AppImage/scripts/notification_channels.py'
      - 'AppImage/components/apprise-service-help.tsx'
      - 'AppImage/components/notification-settings.tsx'
      - 'tests/test_apprise_services.py'
      - 'tests/test_apprise_service_help.cjs'
  push:
    branches: [main, develop]
    paths:
      - 'AppImage/scripts/notification_channels.py'
      - 'AppImage/components/apprise-service-help.tsx'
      - 'tests/test_apprise_services.py'
      - 'tests/test_apprise_service_help.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apprise-services:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        apprise: ['1.7.0', '2.0.1']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
      - name: Install fixture dependencies
        run: |
          python -m pip install 'apprise==${{ matrix.apprise }}'
          npm ci --prefix .github/ci/offline-node --ignore-scripts --no-audit --no-fund
      - name: Test real provider plugins with mocked HTTP
        run: python -B -m unittest discover -s tests -p test_apprise_services.py -v
      - name: Render provider help and locale fallback
        env:
          NODE_PATH: ${{ github.workspace }}/.github/ci/offline-node/node_modules
        run: node tests/test_apprise_service_help.cjs
