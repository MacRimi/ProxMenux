name: Native Monitor AppImage validation

on:
  pull_request:
    paths:
      - '.github/workflows/test-appimage-native.yml'
      - 'AppImage/scripts/build_appimage.sh'
      - 'AppImage/scripts/appimage_arch.sh'
      - 'AppImage/scripts/AppRun'
      - 'tests/test_appimage_arch.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate native architecture selection
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          python -B -m unittest discover -s tests -p test_appimage_arch.py -v
      - name: Refresh package indexes for bundled monitoring tools
        run: sudo apt-get update
      - name: Build native AppImage without publishing it
        run: bash AppImage/scripts/build_appimage.sh
      - name: Extract native AppImage without FUSE
        run: |
          mkdir /tmp/proxmenux-native-extract
          cd /tmp/proxmenux-native-extract
          image=$(find "$GITHUB_WORKSPACE/AppImage/dist" -name '*.AppImage' -type f -print -quit)
          test -n "$image"
          chmod +x "$image"
          "$image" --appimage-extract
          test -f squashfs-root/usr/bin/flask_server.py
          test -f squashfs-root/usr/bin/appimage_arch.sh
          test -f squashfs-root/web/index.html
      - name: Import bundled Python 3.11 native WebSocket runtime
        env:
          PYTHONPATH: /tmp/proxmenux-native-extract/squashfs-root/usr/lib/python3/vendor/cp311:/tmp/proxmenux-native-extract/squashfs-root/usr/lib/python3/dist-packages
        run: python -c 'import gevent, greenlet, geventwebsocket, zope.interface; from PIL import Image; from gevent import pywsgi; print(gevent.__version__)'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Import bundled Python 3.13 native WebSocket runtime
        env:
          PYTHONPATH: /tmp/proxmenux-native-extract/squashfs-root/usr/lib/python3/vendor/cp313:/tmp/proxmenux-native-extract/squashfs-root/usr/lib/python3/dist-packages
        run: python -c 'import gevent, greenlet, geventwebsocket, zope.interface; from PIL import Image; from gevent import pywsgi; print(gevent.__version__)'
