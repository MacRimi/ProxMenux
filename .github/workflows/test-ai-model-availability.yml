name: AI model availability tests

on:
  pull_request:
    paths:
      - '.github/workflows/test-ai-model-availability.yml'
      - 'AppImage/config/verified_ai_models.json'
      - 'AppImage/scripts/ai_providers/**'
      - 'AppImage/scripts/tests/test_groq_model_recommendations.py'
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/test-ai-model-availability.yml'
      - 'AppImage/config/verified_ai_models.json'
      - 'AppImage/scripts/ai_providers/**'
      - 'AppImage/scripts/tests/test_groq_model_recommendations.py'

permissions:
  contents: read

jobs:
  model-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test model ordering and curated availability without network or credentials
        run: python -B -m unittest discover -s AppImage/scripts/tests -p test_groq_model_recommendations.py -v
